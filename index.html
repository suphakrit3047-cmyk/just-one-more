<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:title" content="Just One More · อีกมวนเดียว">
<meta property="og:description" content="ใช้ชีวิต 12 เดือนให้มีความสุขที่สุด แต่ทุกความสุขจากควันมีราคาที่ต้องจ่าย เล่นออนไลน์กับเพื่อนได้">
<meta property="og:image" content="https://suphakrit3047-cmyk.github.io/just-one-more/assets/og.jpg">
<meta property="og:type" content="website">

<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Just One More</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Tabletop: wood table, paper cards, wooden tokens. Cigarette is a physical object so it keeps fixed colors in both themes. */
:root{
  --wood:#8A6542; --wood-2:#734F31; --on-wood:#FFF5E3; --on-wood-muted:#EBD9BB;
  --paper:#F8F2E4; --paper-2:#EEE5CF; --ink:#26221A; --muted:#675F4C; --line:#D5C9AE;
  --ember:#D2531A; --ember-soft:#F7DCC9; --danger:#B01F2D; --danger-soft:#F4D5D2;
  --calm:#2C6F5F; --calm-soft:#D3E8DF; --gold:#A57A12;
  --p1:#D2531A; --p2:#2C7A66; --p3:#6B4EA2; --p4:#A57A12;
  --shadow:0 1px 0 rgba(0,0,0,.12),0 8px 18px -8px rgba(0,0,0,.5);
  --font-display:"Chakra Petch","Sukhumvit Set","Thonburi",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Sukhumvit Set","Thonburi","Leelawadee UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wood:#2E2219; --wood-2:#241A12; --on-wood:#F3E7D2; --on-wood-muted:#BCA98B;
  --paper:#302A21; --paper-2:#3B3429; --ink:#F0E8D7; --muted:#B5A88E; --line:#51483A;
  --ember:#F07B3E; --ember-soft:#4C2C1A; --danger:#EC6070; --danger-soft:#4B2026;
  --calm:#5DB39C; --calm-soft:#1C3A32; --gold:#D6AE37;
  --p1:#F07B3E; --p2:#5DB39C; --p3:#A68BE0; --p4:#D6AE37;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 20px -8px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --wood:#2E2219; --wood-2:#241A12; --on-wood:#F3E7D2; --on-wood-muted:#BCA98B;
  --paper:#302A21; --paper-2:#3B3429; --ink:#F0E8D7; --muted:#B5A88E; --line:#51483A;
  --ember:#F07B3E; --ember-soft:#4C2C1A; --danger:#EC6070; --danger-soft:#4B2026;
  --calm:#5DB39C; --calm-soft:#1C3A32; --gold:#D6AE37;
  --p1:#F07B3E; --p2:#5DB39C; --p3:#A68BE0; --p4:#D6AE37;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 20px -8px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;min-height:100vh;
  background-color:var(--wood);
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 7px),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 31px),repeating-linear-gradient(90deg,transparent 0 359px,rgba(0,0,0,.18) 359px 361px),linear-gradient(180deg,var(--wood),var(--wood-2))}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:rgba(20,14,8,.55);color:var(--on-wood);backdrop-filter:blur(2px)}
header .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;line-height:1}
.logo span{font-size:13px;color:var(--on-wood-muted);letter-spacing:.05em}
.warn{font-size:12px;color:var(--on-wood-muted);max-width:420px;line-height:1.4}
.warn b{color:var(--on-wood)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
main.wrap{padding-block:16px 40px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:8px 14px;font-weight:600;min-height:40px}
@media (hover:hover){button:hover:not(:disabled){background:var(--paper-2)}}
button:focus-visible,input:focus-visible,select:focus-visible,.loc:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.primary:hover:not(:disabled){background:var(--muted);border-color:var(--muted)}
button.ember{border-color:var(--ember);color:var(--ember)}
button.calm{border-color:var(--calm);color:var(--calm)}
.hdrbtn{background:transparent;color:var(--on-wood);border-color:var(--on-wood-muted);min-height:36px;padding:5px 12px}
.hdrbtn:hover:not(:disabled){background:rgba(255,255,255,.12)}
.label{font-size:12px;letter-spacing:.05em;color:var(--muted);font-weight:600}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.paper{background:var(--paper);border-radius:12px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:.02em;border-radius:99px;padding:1px 9px;border:1.5px solid currentColor;width:max-content;max-width:100%}
.chip.no{color:var(--danger)} .chip.yes{color:var(--ember)} .chip.spot{color:var(--muted)} .chip.private{color:var(--calm)}

/* table layout */
.play{display:grid;grid-template-columns:minmax(0,1fr) 410px;grid-template-areas:"top mat" "locs mat" "seats mat" "log mat";grid-template-rows:auto auto auto 1fr;gap:16px 20px;align-items:start}
.a-top{grid-area:top;display:flex;flex-direction:column;gap:12px;min-width:0}
.a-locs{grid-area:locs;min-width:0}
.a-mat{grid-area:mat;display:flex;flex-direction:column;gap:16px;min-width:0;position:sticky;top:12px}
.a-seats{grid-area:seats;min-width:0}
.a-log{grid-area:log;min-width:0}
@media (max-width:980px){
  .play{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "locs" "mat" "seats" "log";grid-template-rows:none}
  .a-mat{position:static}
  main.wrap.has-dock{padding-bottom:96px}
}
.zone{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--on-wood-muted);margin:0 0 8px;text-transform:uppercase}

/* calendar + month card */
.monthbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:stretch}
.cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;flex:1 1 380px;min-width:0;align-self:center}
.cal span{background:rgba(255,255,255,.14);color:var(--on-wood-muted);border-radius:5px;text-align:center;font-size:11px;font-weight:600;padding:4px 0;position:relative;white-space:nowrap;overflow:hidden}
.cal span.past{background:rgba(0,0,0,.18);color:rgba(255,255,255,.4);text-decoration:line-through}
.cal span.now{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.cal span.sp::after{content:"";position:absolute;top:2px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--ember)}
.mcard{flex:1 1 300px;padding:10px 14px;display:flex;gap:12px;align-items:center;min-width:0;border-left:6px solid var(--gold)}
.mcard .mn{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;color:var(--gold);flex:none}
.mcard h2{font-family:var(--font-display);font-size:18px;margin:0;line-height:1.25}
.turn{display:flex;align-items:center;gap:12px 16px;padding:10px 14px;border-left:8px solid var(--pc);flex-wrap:wrap}
.turn .tk{width:40px;height:40px;border-radius:50%;background:var(--pc);flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:18px}
.turn .who{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.1;color:var(--pc)}
.turn .hint{font-size:13.5px;color:var(--muted)}
.turn .hint.warnh{color:var(--danger);font-weight:600}
.tip p{margin:0 0 8px}.tip p:last-child{margin:0}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:18px;background:var(--paper-2);border-radius:10px;padding:12px}
.fv{display:inline-flex;gap:5px;align-items:center}.fv.good{color:var(--ember)}.fv.bad{color:var(--danger)}.fo{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:8px}.steps div{display:flex;gap:10px;align-items:center}.steps div>b{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none;font-family:var(--font-display)}
.locrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.locrow span{background:var(--acc);color:#fff;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.two div{background:var(--paper-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}.two div>b{font-family:var(--font-display);font-size:18px}
@media (max-width:420px){.two{grid-template-columns:minmax(0,1fr)}.locrow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rules{display:flex;flex-direction:column;gap:6px;font-size:13px;margin-top:8px}.rules div{border-left:3px solid var(--line);padding-left:8px}
.learn{max-width:960px;margin:0 auto 18px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;border-left:8px solid var(--calm)}
.learn>div:first-child{display:flex;flex-direction:column}.learn b{font-family:var(--font-display);font-size:18px}
#guideRoot{position:fixed;left:0;right:0;bottom:0;z-index:45;pointer-events:none;display:flex;justify-content:center;padding:0 12px max(12px,env(safe-area-inset-bottom,0px))}
.gpanel{pointer-events:auto;background:var(--ink);color:var(--paper);border-radius:14px;box-shadow:0 14px 30px -8px rgba(0,0,0,.7);padding:12px 16px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:8px}
.gpanel p{margin:0;font-size:15.5px;line-height:1.5}
.gpanel .label{color:var(--paper);opacity:.75}
.gwho{display:flex;align-items:center;gap:8px}.gav{width:30px;height:30px;border-radius:50%;background:var(--calm);color:#fff;display:grid;place-items:center}.gav .ico{width:18px;height:18px}
.gquit{margin-left:auto;background:transparent;color:var(--paper);border-color:rgba(255,255,255,.35);min-height:32px;padding:3px 10px;font-size:12.5px;font-weight:500}
.gpanel button.primary{background:var(--paper);color:var(--ink);border-color:var(--paper);align-self:flex-end;min-width:120px}
.gpanel button.primary:hover:not(:disabled){background:var(--paper-2);border-color:var(--paper-2);color:var(--ink)}
.gquit:hover:not(:disabled){background:rgba(255,255,255,.12)!important}
body.guiding main.wrap{padding-bottom:240px}
body.guiding .dock{display:none}
body.guiding .loc:disabled{opacity:.45}
.gtarget{outline:4px solid var(--calm)!important;outline-offset:4px;border-radius:12px;position:relative;z-index:2}
.gnote{display:flex;gap:8px;align-items:flex-start;background:var(--calm-soft);color:var(--ink);border-left:4px solid var(--calm);border-radius:8px;padding:8px 10px;font-size:14px}.gnote .ico{color:var(--calm);margin-top:3px}
@media (prefers-reduced-motion:no-preference){.gtarget,.gpulse{animation:gp 1.2s ease-in-out infinite}@keyframes gp{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--calm) 35%,transparent)}}}
.dlg .btns button.gpulse{outline:3px solid var(--calm);outline-offset:2px}
.coachrow{display:flex;gap:8px;align-items:center;font-size:14px}.coachrow input{width:20px;height:20px;accent-color:var(--calm)}
.pips{display:flex;gap:6px;align-items:center;margin-left:auto}
.pips i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pc);display:block}
.pips i.done{background:var(--pc)}
.pips i.cur{background:var(--pc);opacity:.4}
@media (prefers-reduced-motion:no-preference){.turn.me .tk{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}}

/* location cards */
.locs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1180px) and (min-width:981px){.locs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.locs{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.loc{--acc:#555;background:var(--paper);color:var(--ink);border:none;border-radius:12px;padding:0;text-align:left;display:flex;flex-direction:column;min-height:168px;font-weight:400;box-shadow:var(--shadow);overflow:hidden;position:relative;transition:transform .15s ease,box-shadow .15s ease}
.loc .lh{background:var(--acc);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px}
.loc .lh .ico{width:26px;height:26px;stroke-width:1.8}
.loc .nm{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.15}
.loc .lb{display:flex;flex-direction:column;gap:6px;padding:8px 12px 10px;flex:1}
.loc .act{font-size:13px;color:var(--ink);line-height:1.45}
.loc.pick{cursor:pointer}
.loc.pick::after{content:"";position:absolute;inset:0;border-radius:12px;border:2.5px solid transparent;pointer-events:none}
@media (hover:hover){.loc.pick:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 14px 24px -10px rgba(0,0,0,.6)}.loc.pick:hover:not(:disabled)::after{border-color:var(--acc)}}
.loc.pick:active:not(:disabled){transform:scale(.98)}
.loc:disabled{cursor:default}
.loc.full{filter:grayscale(.8);opacity:.6}
.loc.wait{opacity:1}
.pawns{display:flex;gap:4px;margin-top:auto;min-height:28px;flex-wrap:wrap}
.pawn{width:28px;height:28px;border-radius:50%;color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;border:2px solid rgba(255,255,255,.85);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.35)}
@media (max-width:640px){.loc{min-height:150px}.loc .act{font-size:12.5px}.loc .nm{font-size:16px}.loc .lh{padding:7px 10px}.loc .lb{padding:7px 10px 9px}}

/* player mat */
.mat{padding:0;overflow:hidden;border-top:8px solid var(--pc)}
.mat .mh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:12px 16px 0}
.mat h3{font-family:var(--font-display);font-size:22px;margin:0;color:var(--pc);line-height:1.15}
.mat .chr{padding:2px 16px 0;font-size:13px;color:var(--muted)}
.mat .chr b{color:var(--ink)}
.mat .sec{padding:12px 16px;border-top:1px dashed var(--line)}
.mat .sec:first-of-type{border-top:none}
.mode{font-size:12.5px;font-weight:600;border-radius:99px;padding:2px 10px}
.mode.smoke{background:var(--ember-soft);color:var(--ember)} .mode.quit{background:var(--calm-soft);color:var(--calm)} .mode.free{background:var(--calm);color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 16px 4px}
.tok{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper-2);border-radius:10px;padding:8px 4px 6px;position:relative}
.tok .ico{width:20px;height:20px;color:var(--tc,var(--muted))}
.tok b{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1}
.tok span{font-size:11.5px;color:var(--muted);font-weight:600}
.tok.bad b{color:var(--danger)}
.trk{display:flex;flex-direction:column;gap:5px}
.trk .tl{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.trk .tl .label{display:inline-flex;gap:5px;align-items:center}
.track{display:flex;gap:4px}
.cell{flex:1;min-width:0;height:36px;border-radius:8px;background:var(--paper-2);display:grid;place-items:center;font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--muted);position:relative}
.cell.red{background:var(--danger-soft);color:var(--danger)}
.cell.on{color:transparent}
.cell.on::after{content:"";width:24px;height:24px;border-radius:50%;background:var(--pc,var(--ink));position:absolute;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),0 2px 3px rgba(0,0,0,.35)}
.yield{display:flex;gap:4px}
.yield span{flex:1;text-align:center;font-size:11.5px;color:var(--muted);font-weight:600}
.inv{display:flex;flex-wrap:wrap;gap:8px}
.it{display:inline-flex;align-items:center;gap:6px;background:var(--paper-2);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.it .ico{color:var(--muted)}
.dcards{display:flex;flex-wrap:wrap;gap:6px}
.dcard{border:2px solid var(--danger);color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:4px 8px;font-size:12.5px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.fa{display:flex;flex-wrap:wrap;gap:8px}
.fa button{flex:1 1 auto}

/* cigarette */
.cig{display:flex;flex-direction:column;gap:6px}
.cig .ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.cig .ct b{font-family:var(--font-display);font-size:15px}
.stick{display:flex;height:48px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));max-width:420px}
.slot{flex:1;min-width:0;background:#FBF8F1;color:#26221A;border-block:1.5px solid #D7CFBE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;font-weight:700;line-height:1.1;position:relative;font-family:var(--font-display)}
.slot+.slot{border-left:1px dashed #D7CFBE}
.slot:first-child{border-radius:4px 0 0 4px;border-left:1.5px solid #D7CFBE}
.slot.butt{background:#D9A55B radial-gradient(circle,#c38b3f 1px,transparent 1.5px) 0 0/6px 6px;border-color:#B98840;border-radius:0 6px 6px 0;color:#3A2A12}
.fx{display:inline-flex;align-items:center;gap:1px}
.fx .ico{width:13px;height:13px;stroke-width:2.4}
.fx.c{color:#2C6F5F} .fx.d{color:#B01F2D} .fx.h{color:#C2470F} .fx.a{color:#6B4EA2}
.slot.burnt{background:#8E897D repeating-linear-gradient(135deg,rgba(0,0,0,.12) 0 2px,transparent 2px 6px);border-color:#77736A;color:transparent}
.slot.burnt .fx{opacity:0}
.slot.lit{background:linear-gradient(90deg,#4A443B 0 8%,#FF7A1F 8% 20%,#FFB36B 20% 26%,#FBF8F1 34%)}
.slot.lit::before{content:"";position:absolute;left:4%;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle,#FFD08A,#FF6A1A 55%,transparent 70%)}
@media (prefers-reduced-motion:no-preference){.slot.lit::before{animation:glow 1.4s ease-in-out infinite}@keyframes glow{50%{opacity:.4;transform:scale(1.3)}}}
.smoke{position:relative}
.packs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pk{width:20px;height:auto;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.packs .pk+.pk{margin-left:-8px}

/* seats */
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.seat{padding:10px 12px;border-top:5px solid var(--pc);display:flex;flex-direction:column;gap:6px;position:relative}
.seat.cur{outline:3px solid var(--pc);outline-offset:2px}
.seat .st{display:flex;justify-content:space-between;align-items:center;gap:8px}

 const first=[...btns].find(b=>!b.disabled);if(first)first.focus();
})}
function modal(o){if(NET.mode==="host"){if(o.who&&o.who.id!==NET.me)return remotePrompt(o.who.id,o);if(!o.who)netNotice(o)}return localModal(o)}
const info=(title,body,who)=>modal({title,body,who,buttons:[{label:"ตกลง",value:1,kind:"primary"}]});

/* ---------- temptation ---------- */
async function tempt(p,reason){
 if(p.mode==="smoke")return"none";
 const mods=[];
 if(p.mode==="free")mods.push(["เลิกสำเร็จแล้ว",3]);
 if(p.mode==="quit"&&p.qm>0)mods.push([`เลิกมาแล้ว ${p.qm} เดือน`,Math.min(p.qm,2)]);
 if(p.ny)mods.push(["ปณิธานปีใหม่",1]);
 if(isC(p,"warned"))mods.push(["หมอเตือนแล้ว",2]);
 if(p.med)mods.push(["ยาช่วยเลิกจากคลินิก",1]);
 if(p.support>0)mods.push(["ครอบครัวสนับสนุน (ใช้แล้วหมด)",1]);
 if(p.loc&&S.phase==="act"&&(p.loc==="spot"||p.loc==="chill"))mods.push(["อยู่ในที่ที่มีคนสูบ",-1]);
 if(p.stress)mods.push(["เครียด",-1]);
 const givers=S.players.filter(o=>o!==p&&o.happy>=1);
 const body=`<p style="margin:0">${esc(reason)} ต้องทอยเต๋า + ตัวช่วย ให้ได้<b>มากกว่าความอยาก (${p.craving})</b> ถึงจะต้านได้</p>
 <div class="mods">${mods.length?mods.map(m=>`<div><span>${m[0]}</span><span class="num">${m[1]>0?"+":""}${m[1]}</span></div>`).join(""):"<div><span>ยังไม่มีตัวช่วย</span></div>"}</div>
 ${p.gum>0?`<label class="row"><input type="checkbox" id="useGum"> ใช้หมากฝรั่งนิโคติน +1 (เหลือ ${p.gum})</label>`:""}
 ${givers.length?`<label class="label" for="enc">ให้ผู้เล่นอื่นช่วยให้กำลังใจ +1 (ผู้ให้เสียความสุข 1 ได้แต้มน้ำใจ 1)</label><select id="enc"><option value="">ไม่มี</option>${givers.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select>`:""}`;
 await coach("tempt",p);
 const r=await modal({title:"ทอยต้านใจ",who:p,body,buttons:[{label:"ทอยเต๋า",value:1,kind:"primary"}]});
 let total=mods.reduce((a,m)=>a+m[1],0);
 if(p.support>0)p.support--;
 if(r.form.useGum){p.gum--;p.st.aid=1;total+=1}
 if(r.form.enc&&NET.mode){const g0=S.players[+r.form.enc];const ok=await modal({title:`${esc(p.name)} ขอกำลังใจ`,who:g0,body:`<div>${esc(p.name)} กำลังทอยต้านใจ ถ้ายอมให้กำลังใจ คุณเสียความสุข 1 ได้แต้มน้ำใจ 1 และเขาทอย +1</div>`,buttons:[{label:"ให้กำลังใจ",value:1,kind:"primary"},{label:"ไม่ให้",value:0}]});if(!ok.v){r.form.enc="";log(`${g0.name} ไม่ได้ให้กำลังใจ ${p.name}`)}}
 if(r.form.enc){const g=S.players[+r.form.enc];g.happy--;g.bonus++;g.st.enc=(g.st.enc||0)+1;total+=1;log(`${g.name} ให้กำลังใจ ${p.name}`)}
 const roll=d6();const sum=roll+total;const ok=sum>p.craving;
 let out,msg;
 if(ok){out="resist";msg=`ต้านไว้ได้ ${sum} มากกว่า ${p.craving}`;log(`${p.name} ต้านใจได้ (${reason})`)}
 else if(p.mode==="free"){p.st.lapsed=true;out="relapse";p.mode="smoke";setAdd(p,p.add+1);p.craving=clamp(p.craving+1,0,6);msg="กลับไปสูบเต็มตัว ระดับการติด +1";log(`${p.name} กลับไปสูบ`,"m")}
 else if(p.lapses===0){p.st.lapsed=true;out="lapse";p.lapses=1;p.lapsedM=true;p.qm=0;p.craving=clamp(p.craving+1,0,6);addDisease(p,1,"เผลอสูบ");msg="เผลอสูบไป 1 ครั้ง ยังอยู่ในโหมดเลิก แต่ต้องนับเดือนใหม่ตั้งแต่ศูนย์ และพลาดอีกครั้งจะกลับไปสูบ";log(`${p.name} พลาด (lapse)`,"m")}
 else{out="relapse";p.mode="smoke";p.lapses=0;p.qm=0;setAdd(p,p.add+1);msg="พลาดครั้งที่สอง กลับไปสูบเหมือนเดิม ระดับการติด +1";log(`${p.name} กลับไปสูบ (relapse)`,"m")}
 render();
 await modal({title:ok?"ต้านไว้ได้":"แพ้ใจ",who:p,body:`<div class="row"><div class="die">${roll}</div><div><div class="num">${roll} ${total>=0?"+":"−"} ${Math.abs(total)} = ${sum} เทียบความอยาก ${p.craving}</div><div>${msg}</div></div></div>`,buttons:[{label:"ต่อ",value:1,kind:"primary"}]});
 return out;
}

/* ---------- smoking ---------- */
function puff(p,kind){
 let a=kind==="cig"?p.active:p.apod;
 if(!a){const src=kind==="cig"?p.hand:p.pods;a={k:src.shift(),pos:0};if(kind==="cig")p.active=a;else p.apod=a;log(`${p.name} เปิด${PACKS[a.k].name}ใหม่`)}
 const pk=PACKS[a.k],s=pk.slots[a.pos];
 const h=YIELD[p.add]+(s.h||0);
 p.craving=clamp(p.craving+(s.c||0),0,6);p.happy+=h;
 log(`${p.name} ${kind==="cig"?"สูบ":"สูด"}${pk.name} ความสุข +${h}`);
 if(s.d)addDisease(p,s.d,kind==="cig"?"บุหรี่":"บุหรี่ไฟฟ้า");
 if(s.a)setAdd(p,p.add+s.a);
 a.pos++;
 if(a.pos>=pk.slots.length){if(kind==="cig"){p.active=null;p.packsDone++;if(p.packsDone%(isC(p,"newbie")?2:isC(p,"veteran")?4:3)===0)setAdd(p,p.add+1)}else{p.apod=null;p.podsDone=(p.podsDone||0)+1;if(p.podsDone%2===0)setAdd(p,p.add+1)}log(`${p.name} ${kind==="cig"?"สูบหมดซอง":"พ็อดหมด"}`)}
 else if(kind==="cig")p.active=a;else p.apod=a;
}
const canCig=p=>p.active||p.hand.length;
const canPod=p=>p.vape&&(p.apod||p.pods.length);

async function smokeStep(p,loc){
 if(p.mode!=="smoke")return;
 const L=LOCS.find(l=>l.id===loc);const allowed=(L.smoke!=="no"||(loc==="work"&&isC(p,"veteran")))&&!(loc==="home"&&isC(p,"parent"));
 const opts=[];
 if(allowed&&canCig(p))opts.push({label:"สูบบุหรี่ 1 ช่อง",value:"cig",kind:"ember"});
 if(!opts.length)return;
 opts.push({label:"ไม่สูบ",value:"no"});
 const others=loc==="home"?[]:S.present[loc].filter(id=>id!==p.id).map(id=>S.players[id]);
 await coach("smoke",p);if(others.length&&loc!=="spot")await coach("crowd",p);
 const r=await modal({title:"สูบไหม",who:p,body:`<div>ความอยากตอนนี้ <b class="num">${p.craving}</b>/6 · สูบ 1 ช่องได้ความสุข <b class="num">+${YIELD[p.add]}</b> จากระดับการติด ${p.add}</div>${others.length&&loc!=="spot"?`<div class="small">มี ${others.map(o=>esc(o.name)).join(", ")} อยู่ด้วย ถ้าสูบตรงนี้จะเสียความสุข 1 ต่อคน${allowed?" และบุหรี่มวนทำให้เขาได้โรค +1":""}</div>`:""}`,buttons:opts});
 if(r.v==="no")return;
 puff(p,r.v);
 if(loc==="spot"){p.happy++;log(`${p.name} สูบที่จุดสูบสบายใจกว่า ความสุข +1`)}
 const more=()=>r.v==="cig"?canCig(p):canPod(p);
 let n=1;
 while(allowed&&more()){
  await coach("chain",p);
  const c=await modal({title:"อีกมวนเดียว?",who:p,body:`<div>สูบไปแล้ว <b class="num">${n}</b> ช่องในแอคชันนี้ · ความอยาก <b class="num">${p.craving}</b>/6</div><div>สูบต่อได้ความสุขอีก แต่ต้องทอยเต๋าก่อน ได้ <b>1–2 = ไอ</b> โรค +1 และต้องหยุดทันที</div>`,buttons:[{label:"อีกมวนเดียว",value:1,kind:"ember"},{label:"พอแล้ว",value:0,kind:"primary"}]});
  if(!c.v)break;
  const roll=d6();
  if(roll<=(isC(p,"veteran")?1:2)){addDisease(p,1,"ไอ สูบรวดเกิน");render();await info("ไอ!",`<div class="row"><div class="die">${roll}</div><div>สูบรวดเกินไป ไอจนต้องหยุด โรค +1</div></div>`,p);break}
  puff(p,r.v);n++;render();
 }
 if(n>1)log(`${p.name} สูบรวด ${n} ช่อง`);
 p.st.maxChain=Math.max(p.st.maxChain,n);if(n>=4)p.st.c4=(p.st.c4||0)+1;
 if(others.length&&loc!=="spot"){p.happy-=others.length;log(`${p.name} สูบต่อหน้าคนอื่น ความสุข −${others.length}`);if(r.v==="cig")others.forEach(o=>{o.st.sh=(o.st.sh||0)+1;addDisease(o,1,`ควันมือสองจาก ${p.name}`)})}
 render();
 if((loc==="spot"||loc==="chill")&&others.length){
  const r2=await modal({title:"ชวนใครสูบด้วยไหม",who:p,body:`<div class="small">ถ้าเขารับ ได้ความสุข +1 ทั้งคู่ ถ้าปฏิเสธเขาเสียความสุข 1 ถ้าเขากำลังเลิก เขาต้องทอยต้านใจ</div>`,buttons:[...others.map(o=>({label:`ชวน ${esc(o.name)}`,value:o.id})),{label:"ไม่ชวน",value:-1}]});
  if(r2.v>=0)await invite(p,S.players[r2.v]);
 }
}
async function invite(p,o){
 o.st.asked=(o.st.asked||0)+1;
 log(`${p.name} ชวน ${o.name} สูบ`);
 if(o.mode!=="smoke"){p.st.tq=(p.st.tq||0)+1;const out=await tempt(o,`${p.name} ชวนสูบ`);if(out!=="resist"){const b=isC(p,"social")?2:1;p.happy+=b;p.st.inv++;p.st.broke=(p.st.broke||0)+1;log(`${p.name} ความสุข +${b} (มีเพื่อนสูบด้วย)`)}render();return}
 const r=await modal({title:`${esc(p.name)} ชวนสูบด้วยกัน`,who:o,body:`<div>รับ: ได้ความสุข +1 ทั้งคู่ และสูบ 1 ช่อง${canCig(o)||canPod(o)?" จากของตัวเอง":" (เพื่อนแบ่งให้ โรค +1)"}</div><div>ปฏิเสธ: เสียความสุข 1 เพราะเกรงใจ</div>`,buttons:[{label:"รับ",value:1,kind:"ember"},{label:"ปฏิเสธ",value:0}]});
 if(r.v){if(canCig(o))puff(o,"cig");else if(canPod(o))puff(o,"pod");else{o.craving=clamp(o.craving-1,0,6);o.happy+=YIELD[o.add];addDisease(o,1,"บุหรี่ที่เพื่อนแบ่ง")}p.happy+=isC(p,"social")?2:1;o.happy++;p.st.inv++;log(`${o.name} รับคำชวน`)}
 else{o.happy--;log(`${o.name} ปฏิเสธ ความสุข −1`)}
 render();
}

/* ---------- places ---------- */
async function doLoc(p,loc){
 if(loc==="home"){const h=isC(p,"social")?0:1;p.happy+=h;if(isC(p,"parent")&&p.support<1){p.support++;log(`${p.name} ลูกยิ้มให้ ได้โทเคนสนับสนุน`)}if(p.mode!=="smoke"){p.craving=clamp(p.craving-1,0,6)}log(`${p.name} พักที่บ้าน ความสุข +${h}${p.mode!=="smoke"?" ความอยาก −1":""}`)}
 else if(loc==="work"){const m=isC(p,"office")?4:3;p.money+=m;if(isC(p,"office")){p.happy--;log(`${p.name} ทำงานจนเหนื่อย ความสุข −1`)}log(`${p.name} ทำงาน ได้เงิน +${m}`)}
 else if(loc==="spot"){const o=S.present.spot.filter(id=>id!==p.id).length;const b=o?2:1;p.happy+=b;log(`${p.name} ${o?"คุยกับเพื่อน":"ยืนพักคนเดียว"}ที่จุดสูบ ความสุข +${b}`)}
 else if(loc==="store")await shop(p);
 else if(loc==="chill")await chill(p);
 else if(loc==="clinic")await clinic(p);
 render();
}
async function shop(p){
 await coach("store",p);
 for(;;){render();
  const items=[["cheap",`บุหรี่${PACKS.cheap.name} (4 ช่อง)`,2],["gum","หมากฝรั่งนิโคติน",2]];
  const r=await modal({title:"ร้านสะดวกซื้อ",who:p,body:`<div>เงินที่มี <b class="num">${p.money}</b> เหรียญ</div>`,buttons:[...items.map(([k,n,c])=>({label:`${n} · ${c}`,value:k,disabled:p.money<c||(k==="device"&&p.vape)||(k==="pod"&&!p.vape)})),{label:"ออกจากร้าน",value:"done",kind:"primary"}]});
  if(r.v==="done")return;
  const c=items.find(i=>i[0]===r.v)[2];p.money-=c;
  if(r.v==="cheap")p.hand.push(r.v);else p.gum++;
  log(`${p.name} ซื้อ${items.find(i=>i[0]===r.v)[1].split(" (")[0]}`);
 }
}
async function chill(p){
 const r=await modal({title:"ร้านนั่งชิล",who:p,body:`<div>เงินที่มี <b class="num">${p.money}</b> · ความสุขแบบนี้ไม่มีโรค แต่ไม่ลดความอยาก</div>`,buttons:[{label:"จ่าย 3 เหรียญ → ความสุข +4",value:1,kind:"primary",disabled:p.money<3},{label:"แค่นั่งเฉยๆ",value:-1}]});
 if(r.v>=0){p.money-=3;p.happy+=4;log(`${p.name} ใช้เวลาที่ร้านนั่งชิล ความสุข +4`)}
}
async function clinic(p){
 if(S.clinic>=2){await info("คิวเต็ม","คลินิกรับได้ 2 คิวต่อเดือน เดือนนี้เต็มแล้ว",p);return}
 const r=await modal({title:"คลินิก",who:p,body:`<div>เงินที่มี <b class="num">${p.money}</b> · การ์ดโรคเป็นโรคเรื้อรัง รักษาไม่หาย</div>`,buttons:[
  {label:"รักษา: ลบโทเคนโรค 3 · 4 เหรียญ",value:"treat",disabled:p.money<4||p.disease===0},
  {label:"ยาช่วยเลิก: ความอยาก −1, ทอย +1 ทั้งเดือน · 4 เหรียญ",value:"med",disabled:p.money<4},
  {label:"กลับ",value:"done"}]});
 if(r.v==="done")return;
 S.clinic++;
 if(r.v==="treat"){p.money-=4;p.disease=Math.max(0,p.disease-3);log(`${p.name} รักษา ลบโทเคนโรค 3`)}
 if(r.v==="med"){p.money-=4;p.med=true;p.st.aid=1;p.craving=clamp(p.craving-1,0,6);log(`${p.name} รับยาช่วยเลิก`)}
}

/* ---------- life events ---------- */
const EVENTS=[
 {t:"งานพัง เจ้านายด่า",f:async p=>{p.craving=clamp(p.craving+2,0,6);p.stress=true;log(`${p.name} เครียด ความอยาก +2`);return p.mode!=="smoke"?tempt(p,"เครียดจัด อยากได้สักมวน"):null},d:"ความอยาก +2 ถ้ากำลังเลิกต้องทอยต้านใจ"},
 {t:"เพื่อนชวนออกไปสูบหลังข้าว",f:async p=>{if(p.mode!=="smoke")return tempt(p,"เพื่อนยื่นบุหรี่ให้");p.happy+=1;p.craving=clamp(p.craving-1,0,6);addDisease(p,1,"มวนของเพื่อน");return null},d:"คนสูบ: ความสุข +1 ความอยาก −1 โรค +1 · คนเลิก: ทอยต้านใจ"},
 {t:"ปาร์ตี้วันเกิดเพื่อน",f:async p=>{p.happy+=2;log(`${p.name} สนุกที่ปาร์ตี้ +2`);return p.mode!=="smoke"?tempt(p,"ทุกคนในปาร์ตี้สูบ"):null},d:"ความสุข +2 คนที่เลิกอยู่ต้องทอยต้านใจ"},
 {t:"ครอบครัวบอกว่าเป็นห่วง",f:async p=>{p.support++;if(p.mode!=="smoke")p.happy++;log(`${p.name} ได้กำลังใจจากครอบครัว`)},d:"ได้โทเคนสนับสนุน +1 ทอยครั้งหน้า คนที่เลิกอยู่ได้ความสุข +1"},
 {t:"ได้งานพิเศษ",f:async p=>{p.money+=2;log(`${p.name} ได้เงินพิเศษ +2`)},d:"เงิน +2"}
];

/* ---------- month flow ---------- */
async function startMonth(){
 const m=S.month,mc=MONTH_CARDS[m-1];S.clinic=0;S.present={};LOCS.forEach(l=>S.present[l.id]=[]);
 log(`เดือน${MONTHS[m-1]}: ${mc.t}`,"m");
 for(const p of S.players){p.med=false;p.lapsedM=false;p.stress=false;p.loc=null;
  if(p.mode==="smoke")p.craving+=1+(p.add>=5?1:0);
  else if(p.mode==="quit")p.craving+=p.qm===0?2:p.qm===1?1:-1;
  if(isM(12)&&p.mode!=="free")p.craving++;
  p.craving=clamp(p.craving,0,6);
  if(isM(12))p.money+=3;
  if(isM(6)&&p.disease>=5){p.happy-=2;log(`${p.name} ผลตรวจสุขภาพแย่ ความสุข −2`)}
 }
 render();
 await info(`เดือน${MONTHS[m-1]} · ${mc.t}`,`<div>${mc.d}</div><div class="small">ความอยากของทุกคนขยับตามโหมด: คนสูบ +1 · เลิกเดือนแรก +2 · เลิกเดือนที่สอง +1 · หลังจากนั้นลดลง 1</div>`);
 if(m===1)await Promise.all((NET.mode?S.players:[S.players[0]]).map(p=>coach("month",p)));
 if(m===2)await Promise.all((NET.mode?S.players:[S.players[0]]).map(p=>coach("goal",p)));
 if(isM(4))for(const p of S.players)if(p.mode!=="smoke")await tempt(p,"สงกรานต์ ทุกวงมีคนสูบ");
}
async function endMonth(){
 S.phase="end";
 for(const p of S.players){
  const e=EVENTS[rnd(EVENTS.length)];
  render();
  await coach("events",p);
  await info(`อีเวนต์ชีวิต: ${e.t}`,`<div>${e.d}</div>`,p);
  await e.f(p);await flushTips();
  if(p.mode!=="free"&&p.craving>=4){p.happy-=2;p.st.wd=(p.st.wd||0)+1;log(`${p.name} อาการถอน ความสุข −2`);render();await coach("withdraw",p)}
  if(p.mode==="quit"){
   await tempt(p,"ความอยากประจำเดือน คิดถึงบุหรี่ขึ้นมาเอง");

const FXPREV={};const FX_BAD={disease:1,craving:1,add:1};
function fxDiff(){const layer=document.getElementById("fxLayer");if(!layer)return;
 if(!S||S.over){for(const k in FXPREV)delete FXPREV[k];return}
 document.querySelectorAll("[data-sv]").forEach(el=>{const k=el.dataset.sv;const v=+(el.dataset.v??el.textContent);
  if(k in FXPREV&&FXPREV[k]!==v){const d=v-FXPREV[k];const key=k.split(":")[1];const good=FX_BAD[key]?d<0:d>0;
   const r=el.getBoundingClientRect();if(r.width&&r.bottom>0&&r.top<innerHeight){const f=document.createElement("span");f.className="float "+(good?"good":"bad");f.textContent=(d>0?"+":"−")+Math.abs(d);
    f.style.left=(r.left+r.width/2)+"px";f.style.top=(r.top+r.height/2)+"px";layer.appendChild(f);setTimeout(()=>f.remove(),1400)}}
  FXPREV[k]=v})}

 const why=!tie?"":penalty(ranked[0])!==penalty(ranked[1])?"แต้มเท่ากัน ตัดสินด้วยโรคน้อยกว่า":ranked[0].money!==ranked[1].money?"แต้มเท่ากัน ตัดสินด้วยเงินเหลือมากกว่า":"เสมอกันจริงๆ ชนะร่วมกัน";
 return `<div class="hero"><h2>จบปี</h2><p><b style="color:var(--on-wood)">${esc(ranked[0].name)}</b> ชนะ${why?` · ${why}`:""}</p></div>
 <div class="setup" style="max-width:760px">
 <div style="overflow-x:auto"><table><thead><tr><th>ผู้เล่น</th><th>สถานะ</th><th class="r">สุข</th><th class="r">โบนัส</th><th class="r">โรค</th><th class="r">แต้ม</th></tr></thead><tbody>
 ${ranked.map((p,i)=>`<tr class="${i===0?"win":""}"><td><div style="color:${p.col};font-weight:700">${i+1}. ${esc(p.name)}</div><div class="small">${p.char?p.char.name:""}</div><div class="small">${p.goal?`เป้าหมายลับ: ${p.goal.name} ${p.goalDone?"✓ +"+p.goal.pts:"✗"}`:""}</div></td><td>${p.mode==="smoke"?`ยังสูบ ติดระดับ ${p.add}`:p.mode==="quit"?"กำลังเลิก":"เลิกสำเร็จ"}</td><td class="r">${p.happy}</td><td class="r">${p.bonus}</td><td class="r">−${penalty(p)}</td><td class="r" style="font-size:18px">${score(p)}</td></tr>`).join("")}
 </tbody></table></div>
 <div class="small">${ranked.map(p=>p.dcards.length?`${esc(p.name)}: ${p.dcards.map(c=>c.name).join(", ")}`:"").filter(Boolean).join(" · ")||"ไม่มีใครป่วยเป็นโรคจากการ์ด"}</div>
 ${NET.mode==="client"?`<div class="small">รอคนสร้างห้องเริ่มเกมใหม่</div>`:`<div class="row"><button class="primary" id="againBtn">เล่นใหม่</button></div>`}
 <div class="small">ถ้าในชีวิตจริงอยากเลิกบุหรี่ โทรสายด่วน 1600 ได้ฟรี</div></div>`}

/* ---------- online (PeerJS host-authoritative) ---------- */
const PEER_PREFIX="justonemore-th-";
const TEST_BC=/[?&]bc=1/.test(location.search);
function loadPeerLib(){return new Promise((res,rej)=>{if(TEST_BC||window.Peer)return res();const sc=document.createElement("script");sc.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";sc.onload=()=>res();sc.onerror=()=>rej(new Error("load"));document.head.appendChild(sc)})}
/* BroadcastChannel stand-in used only for local testing (?bc=1) */
function FakePeer(id){const self=this;this.id=id||("p"+Math.random().toString(36).slice(2,9));this.h={};this.conns={};const ch=new BroadcastChannel("jom-test");this.ch=ch;
 ch.onmessage=e=>{const m=e.data;if(m.to!==self.id)return;
  if(m.k==="hello"){const c=self._conn(m.from);c._fire("open");(self.h.connection||[]).forEach(f=>f(c));ch.postMessage({k:"ack",to:m.from,from:self.id})}
  else if(m.k==="ack"){const c=self.conns[m.from];if(c)c._fire("open")}
  else if(m.k==="data"){const c=self.conns[m.from];if(c)c._fire("data",m.d)}
  else if(m.k==="bye"){const c=self.conns[m.from];if(c)c._fire("close")}};
 setTimeout(()=>(self.h.open||[]).forEach(f=>f(self.id)),20)}
FakePeer.prototype.on=function(ev,f){(this.h[ev]=this.h[ev]||[]).push(f);return this};
FakePeer.prototype._conn=function(rid){const self=this;const c={peer:rid,h:{},on(ev,f){(this.h[ev]=this.h[ev]||[]).push(f);return this},_fire(ev,a){(this.h[ev]||[]).forEach(f=>f(a))},send(d){self.ch.postMessage({k:"data",to:rid,from:self.id,d:JSON.parse(JSON.stringify(d))})},close(){self.ch.postMessage({k:"bye",to:rid,from:self.id})}};this.conns[rid]=c;return c};
FakePeer.prototype.connect=function(rid){const c=this._conn(rid);this.ch.postMessage({k:"hello",to:rid,from:this.id});return c};
FakePeer.prototype.destroy=function(){this.ch.close()};
function makePeer(id){return TEST_BC?new FakePeer(id):new window.Peer(id)}
function genCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ";return [...Array(4)].map(()=>A[rnd(A.length)]).join("")}
function setMsg(t){NET.msg=t;const el=document.getElementById("netMsg");if(el)el.textContent=t;else render()}
function myName(){const v=(document.getElementById("netName")||{}).value;return (v||"").trim().slice(0,14)}

async function hostRoom(){
 const name=myName();if(!name){setMsg("ใส่ชื่อของคุณก่อน");return}
 setMsg("กำลังสร้างห้อง...");
 try{await loadPeerLib()}catch(e){setMsg("โหลดระบบออนไลน์ไม่ได้ ลองเช็กอินเทอร์เน็ต หรือเปิดจาก GitHub Pages");return}
 const code=genCode();let peer;
 try{peer=makePeer(PEER_PREFIX+code)}catch(e){setMsg("เบราว์เซอร์นี้เล่นออนไลน์ไม่ได้");return}
 NET.peer=peer;
 peer.on("open",()=>{NET.mode="host";NET.code=code;NET.me=0;NET.lobby=[{name,pid:0,on:true}];NET.msg="";render()});
 peer.on("error",err=>{if(err&&err.type==="unavailable-id"){setMsg("รหัสชนกัน ลองกดสร้างห้องอีกครั้ง")}else setMsg("เชื่อมต่อไม่สำเร็จ ("+((err&&err.type)||"error")+")")});
 peer.on("connection",conn=>{conn.on("data",m=>hostOnData(conn,m));conn.on("close",()=>hostOnClose(conn))});
}
function hostOnData(conn,m){
 if(!m||typeof m!=="object")return;
 if(m.t==="join"){
  const name=String(m.name||"").trim().slice(0,14)||"ผู้เล่น";
  let slot=NET.lobby.find(x=>x.name===name&&x.pid!==0&&(!x.on||NET.started));
  if(!slot&&NET.started){conn.send({t:"reject",why:"เกมเริ่มไปแล้ว เข้ากลับได้เฉพาะชื่อเดิมที่หลุดไป"});return}
  const old=slot&&NET.conns[slot.pid];if(old&&old!==conn){try{old.send({t:"reject",why:"มีคนเข้าด้วยชื่อนี้จากเครื่องอื่นแล้ว"})}catch(e){}try{old.close()}catch(e){}}
  if(!slot){if(NET.lobby.length>=4){conn.send({t:"reject",why:"ห้องเต็มแล้ว (4 คน)"});return}
   if(NET.lobby.some(x=>x.name===name)){conn.send({t:"reject",why:"มีชื่อนี้ในห้องแล้ว ลองชื่ออื่น"});return}
   slot={name,pid:NET.lobby.length,on:true};NET.lobby.push(slot)}
  slot.on=true;NET.conns[slot.pid]=conn;conn._pid=slot.pid;
  conn.send({t:"welcome",pid:slot.pid,code:NET.code});
  if(S&&S.players[slot.pid])log(`${slot.name} กลับเข้าห้อง`);
  render();
  const pd=NET.pending[slot.pid];if(pd)conn.send({t:"prompt",id:pd.id,o:pd.o});
  return}
 const pid=conn._pid;if(pid==null)return;
 if(m.t==="answer"){const pd=NET.pending[pid];if(pd&&pd.id===m.id){delete NET.pending[pid];if(S)S.wait="";pd.res({v:m.v,form:m.form||{}})}}
 else if(m.t==="loc"){if(S&&S.cur===pid&&awaitLoc&&LOCS.some(l=>l.id===m.loc)&&!(m.loc==="clinic"&&S.clinic>=2))awaitLoc(m.loc)}
 else if(m.t==="fa"){if(S&&S.cur===pid&&awaitLoc&&["quit","gum","goal"].includes(m.kind)){const p=S.players[pid];if(m.kind==="gum"&&!(p.gum>0&&p.craving>0))return;if(m.kind==="quit"&&p.mode!=="smoke")return;freeAction(m.kind)}}
}
function hostOnClose(conn){const pid=conn._pid;if(pid==null)return;if(NET.conns[pid]===conn){delete NET.conns[pid];const sl=NET.lobby.find(x=>x.pid===pid);if(sl)sl.on=false;if(S)log(`${sl?sl.name:"ผู้เล่น"} หลุดจากห้อง รอเข้ากลับด้วยชื่อเดิม`);render()}}
function remotePrompt(pid,o){return new Promise(res=>{
 const id=++NET.seq;const oo={title:o.title,body:o.body||"",who:o.who?{name:o.who.name,col:o.who.col,id:o.who.id}:null,buttons:o.buttons.map(b=>({label:b.label,value:b.value,kind:b.kind||"",disabled:!!b.disabled}))};
 NET.pending[pid]={id,o:oo,res};if(S)S.wait=`รอ ${o.who.name} ตัดสินใจ`;render();
 const c=NET.conns[pid];if(c)c.send({t:"prompt",id,o:oo})})}
function netNotice(o){const oo={title:o.title,body:o.body||"",who:null,buttons:[{label:"ตกลง",value:1,kind:"primary"}]};for(const c of Object.values(NET.conns))c.send({t:"notice",o:oo})}
let syncT=null;
function netSync(){if(syncT)return;syncT=setTimeout(()=>{syncT=null;
 for(const [pid,c] of Object.entries(NET.conns)){c.send({t:"state",S:S?snapshot(+pid):null,lobby:NET.lobby,turn:!!(S&&S.cur===+pid&&awaitLoc)})}},40)}
function snapshot(pid){
 const reveal=S.over;
 return JSON.parse(JSON.stringify({...S,players:S.players.map(pl=>({...pl,goal:(reveal||pl.id===pid)?pl.goal:null}))}))}
function startOnline(){
 if(NET.lobby.length<2){setMsg("ต้องมีอย่างน้อย 2 คน");return}
 NET.started=true;
 S={quitters:0,players:NET.lobby.map(x=>newPlayer(x.pid,x.name)),month:1,round:1,cur:0,log:[],present:{},clinic:0,phase:"start",over:false,wait:"",coach:true};
 runGame();
}
async function joinRoom(){
 const name=myName();const code=((document.getElementById("netCode")||{}).value||"").trim().toUpperCase();
 if(!name){setMsg("ใส่ชื่อของคุณก่อน");return}if(code.length<4){setMsg("ใส่รหัสห้อง 4 ตัว");return}
 setMsg("กำลังเข้าห้อง...");
 try{await loadPeerLib()}catch(e){setMsg("โหลดระบบออนไลน์ไม่ได้ ลองเช็กอินเทอร์เน็ต หรือเปิดจาก GitHub Pages");return}
 NET.joinName=name;NET.joinCode=code;
 let peer;try{peer=makePeer()}catch(e){setMsg("เบราว์เซอร์นี้เล่นออนไลน์ไม่ได้");return}
 NET.peer=peer;
 const fail=setTimeout(()=>{if(NET.mode!=="client")setMsg("หาห้องไม่เจอ เช็กรหัส หรือให้คนตั้งห้องเปิดหน้าเว็บค้างไว้")},12000);
 peer.on("error",err=>{if(err&&err.type==="peer-unavailable")setMsg("หาห้องไม่เจอ เช็กรหัสอีกครั้ง");else setMsg("เชื่อมต่อไม่สำเร็จ ("+((err&&err.type)||"error")+")")});
 peer.on("open",()=>{const conn=peer.connect(PEER_PREFIX+code,{reliable:true});NET.host=conn;
  conn.on("open",()=>conn.send({t:"join",name}));
  conn.on("data",m=>{clearTimeout(fail);clientOnData(m)});
  conn.on("close",()=>{if(NET.mode==="client"){NET.lost=true;NET.msg="หลุดจากห้อง กดเข้าห้องใหม่ด้วยชื่อเดิมได้";render()}})});
}
function clientOnData(m){
 if(!m||typeof m!=="object")return;
 if(m.t==="reject"){setMsg(m.why||"เข้าห้องไม่ได้");return}
 if(m.t==="welcome"){NET.mode="client";NET.me=m.pid;NET.code=m.code;NET.lost=false;NET.msg="";render();return}
 if(m.t==="state"){S=m.S;if(m.lobby)NET.lobby=m.lobby;awaitLoc=m.turn?(loc=>NET.host.send({t:"loc",loc})):null;render();if(m.turn)focusLocs();return}
 if(m.t==="prompt"){localModal(m.o).then(r=>NET.host.send({t:"answer",id:m.id,v:r.v,form:r.form}));return}
 if(m.t==="notice"){if(!document.getElementById("modalRoot").innerHTML)localModal(m.o);return}
}
function lobbyHTML(){
 const host=NET.mode==="host";
 return `${heroHTML()}<div class="setup">
 <h2>${ico("wifi")}ห้องออนไลน์</h2>
 <p style="margin:0" class="small">${host?"ส่งรหัสนี้ให้เพื่อน ให้เปิดลิงก์เดียวกันแล้วกดเข้าห้อง":"เข้าห้องแล้ว รอคนสร้างห้องกดเริ่มเกม"}</p>
 <div class="code" aria-label="รหัสห้อง">${esc(NET.code||"")}</div>
 <div class="plist">${NET.lobby.map(x=>`<div class="pl"><span class="dot" style="background:${PCOL[x.pid]}"></span><span>${esc(x.name)}${x.pid===NET.me?" (คุณ)":""}${x.pid===0?" · สร้างห้อง":""}</span><span class="small">${x.on?"พร้อม":"หลุด"}</span></div>`).join("")}</div>
 ${host?`<div class="row"><button class="primary" id="startOnlineBtn" ${NET.lobby.length<2?"disabled":""}>เริ่มเกม (${NET.lobby.length}/4)</button><button data-tut="1">สอนเล่น</button></div><div class="small">ต้องมี 2–4 คน · คนสร้างห้องห้ามปิดหน้านี้จนจบเกม</div>`:`<div class="row"><button data-tut="1">อ่านวิธีเล่นระหว่างรอ</button></div>`}
 <div class="small" id="netMsg" role="status">${esc(NET.msg||"")}</div>
 </div>`}

document.addEventListener("click",e=>{
 if(e.target.closest("[data-tutfull]")&&!document.getElementById("modalRoot").innerHTML){tutorial(true);return}
 if(e.target.closest("[data-tut]")&&!document.getElementById("modalRoot").innerHTML){tutorial();return}
 const n=e.target.closest("[data-n]");if(n&&!S){setupN=+n.dataset.n;render();return}
 if(e.target.id==="startBtn"){const names=[...Array(setupN)].map((_,i)=>(document.getElementById("name"+i).value.trim()||`ผู้เล่น ${i+1}`));
  S={quitters:0,players:names.map((nm,i)=>newPlayer(i,nm)),month:1,round:1,cur:0,log:[],present:{},clinic:0,phase:"start",over:false,coach:!!(document.getElementById("coachChk")||{checked:true}).checked};runGame();return}
 if(e.target.closest("#dockBtn")){const m=document.getElementById("matArea");if(m)m.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});return}
 if(e.target.id==="guideNext"&&GUIDE.nextRes){const r=GUIDE.nextRes;GUIDE.nextRes=null;GUIDE.panel=null;r();return}
 if(e.target.id==="guideQuit"){guideEnd();return}
 if(e.target.closest("[data-guide]")&&!document.getElementById("modalRoot").innerHTML){if(S&&!S.over&&!S.guide)return;runGuide();return}
 if(e.target.id==="hostBtn"){hostRoom();return}
 if(e.target.id==="joinBtn"){joinRoom();return}
 if(e.target.id==="startOnlineBtn"&&NET.mode==="host"&&!NET.started){startOnline();return}
 if(e.target.id==="againBtn"){if(NET.mode==="host"){NET.pending={};S=null;NET.started=false;startOnline();return}S=null;render();return}
 const l=e.target.closest(".loc");if(l&&awaitLoc&&!l.disabled&&(NET.mode!=="host"||S.cur===NET.me)){awaitLoc(l.dataset.loc);return}
 const fa=e.target.closest("[data-fa]");if(fa&&awaitLoc&&(NET.mode!=="host"||S.cur===NET.me)){if(NET.mode==="client"){NET.host.send({t:"fa",kind:fa.dataset.fa});return}freeAction(fa.dataset.fa);return}
});
render();
